# hermesagent nginx route (WebUI External Open, new browser tab).
# Layout: bare location (valid only inside a server block — the TOS
# conf.d include lives at server level); the platform loads
# /usr/local/hermesagent/nginx/hermesagent.conf, postinst mirrors it to
# /etc/nginx/conf.d/hermesagent.conf (validated Beszel pattern).
# The trailing slash on proxy_pass strips the /hermesagent/ prefix —
# upstream hermes-webui natively supports subpath mounts (dynamic
# <base> tag + api() resolving against document.baseURI).
location /hermesagent/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrades and SSE-friendly timeouts (chat streaming).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

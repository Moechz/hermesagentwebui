# hermesagent nginx route (WebUI External Open, new browser tab).
# Layout: bare location (valid only inside a server block — the TOS
# conf.d include lives at server level); the platform loads
# /usr/local/hermesagent/nginx/hermesagent.conf, postinst mirrors it to
# /etc/nginx/conf.d/hermesagent.conf (validated Beszel pattern).
# The trailing slash on proxy_pass strips the /hermesagent/ prefix —
# upstream hermes-webui natively supports subpath mounts (dynamic
# <base> tag + api() resolving against document.baseURI).
# Host MUST be forwarded verbatim, port included ($http_host, not $host).
# The TOS gateway serves this app on a NON-default port (https://<tos>:5443/,
# http://<tos>:8181/), so the browser's Origin header carries that port while
# a bare $host strips it. Upstream's CSRF gate compares Origin host:port with
# the Host header and 403s every browser POST/PUT/DELETE on a mismatch
# ("Cross-origin mismatch - check reverse proxy headers") — which shows up in
# the UI as an unrelated-looking probe error. See docs/TASK_STATE.md (seq -015).
# Note: do NOT "fix" this by setting HERMES_WEBUI_TRUST_FORWARDED_HOST in the
# unit — X-Forwarded-Host is client-settable, so trusting it would let a
# cross-site page satisfy the same-origin gate (CSRF bypass). Forwarding the
# client Host verbatim is the correct fix.
location /hermesagent/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrades and SSE-friendly timeouts (chat streaming).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
